services:
  - type: web
    name: smart-college-complaint-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-college-complaints-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_PREFIX
        value: complaint-images

databases:
  - name: smart-college-complaints-db
    plan: free

services:
  - type: web
    name: smart-college-complaint-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-college-complaints-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.14.0

databases:
  - name: smart-college-complaints-db
    plan: free
